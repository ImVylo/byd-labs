<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BYD Labs</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #0b0b0d;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
  /* one soft amber glow behind the mark */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(32rem 32rem at 50% 50%, rgba(255, 122, 26, 0.12), transparent 62%);
    pointer-events: none;
  }
  .logo {
    position: relative;
    width: clamp(10rem, 36vw, 22rem);
    height: clamp(10rem, 36vw, 22rem);
  }
</style>
</head>
<body>
  <svg class="logo" viewBox="0 0 64 64" aria-label="BYD Labs">
    <path d="M32 2 58 17 58 47 32 62 6 47 6 17 Z" fill="#ff7a1a"/>
    <path d="M36 8 18 38 29 38 25 56 47 24 35 24 Z" fill="#0b0b0d"/>
  </svg>
</body>
</html>
