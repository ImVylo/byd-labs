<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BYD Labs</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #070907;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    animation: flicker 9s infinite;
  }
  @keyframes flicker {
    0%, 100% { opacity: 1; }
    4% { opacity: 0.975; }
    6% { opacity: 1; }
    53% { opacity: 1; }
    54% { opacity: 0.985; }
    56% { opacity: 1; }
    83% { opacity: 1; }
    84% { opacity: 0.99; }
    85% { opacity: 1; }
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(30rem 30rem at 50% 40%, rgba(77, 255, 122, 0.15), transparent 62%),
      radial-gradient(46rem 46rem at 50% 110%, rgba(46, 230, 107, 0.08), transparent 60%);
    pointer-events: none;
  }
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.16) 0 1px, transparent 1px 3px);
    pointer-events: none;
    z-index: 1;
  }

  /* drifting tech grid */
  .grid {
    position: fixed;
    inset: -60px;
    background-image:
      linear-gradient(rgba(77,255,122,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(77,255,122,0.05) 1px, transparent 1px);
    background-size: 46px 46px;
    animation: gridDrift 22s linear infinite;
    pointer-events: none;
    z-index: 0;
  }
  @keyframes gridDrift {
    from { transform: translate(0, 0); }
    to   { transform: translate(46px, 46px); }
  }

  /* CRT scan sweep */
  .scan {
    position: fixed;
    left: 0; right: 0;
    height: 140px;
    background: linear-gradient(180deg, transparent, rgba(77,255,122,0.055), transparent);
    animation: scan 8s linear infinite;
    pointer-events: none;
    z-index: 0;
  }
  @keyframes scan {
    0%   { top: -160px; }
    100% { top: 100%; }
  }

  /* corner HUD */
  .hud {
    position: fixed;
    z-index: 2;
    font-size: 0.62rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: rgba(77,255,122,0.42);
    pointer-events: none;
    user-select: none;
  }
  .hud.tl { top: 20px; left: 22px; }
  .hud.br { bottom: 20px; right: 22px; }
  .hud .blink { animation: blink 1.2s steps(1) infinite; color: rgba(77,255,122,0.75); }
  @keyframes blink { 50% { opacity: 0; } }

  .lockup {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2.1rem;
  }
  .mark-wrap {
    position: relative;
    width: clamp(9rem, 30vw, 17rem);
    height: clamp(9rem, 30vw, 17rem);
    will-change: transform;
  }
  .mark-wrap::before,
  .mark-wrap::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px solid rgba(77,255,122,0.35);
    animation: pulse 3.6s ease-out infinite;
  }
  .mark-wrap::after { animation-delay: 1.8s; }
  @keyframes pulse {
    0%   { transform: scale(1);    opacity: 0.55; }
    100% { transform: scale(1.75); opacity: 0; }
  }
  .mark {
    position: relative;
    width: 100%;
    height: 100%;
    display: block;
    filter: drop-shadow(0 0 14px rgba(77, 255, 122, 0.38));
    animation: throb 3.4s ease-in-out infinite;
  }
  @keyframes throb {
    0%, 100% { filter: drop-shadow(0 0 10px rgba(77,255,122,0.28)); }
    50%      { filter: drop-shadow(0 0 24px rgba(77,255,122,0.6)); }
  }
  .mark .ring {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin 26s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .wordmark {
    font-weight: 700;
    font-size: clamp(1.5rem, 5.4vw, 2.6rem);
    letter-spacing: 0.34em;
    color: #d6ffe2;
    text-indent: 0.34em;
    text-shadow:
      0 0 6px rgba(77, 255, 122, 0.7),
      0 0 18px rgba(77, 255, 122, 0.45),
      0 0 42px rgba(77, 255, 122, 0.25);
    animation: glitch 5.5s infinite steps(1);
  }
  .wordmark .slash { color: #4dff7a; }
  @keyframes glitch {
    0%, 93%, 100% { transform: none; opacity: 1; }
    94% { transform: skewX(5deg)  translateX(-2px); opacity: 0.85; }
    95% { transform: skewX(-4deg) translateX(2px);  opacity: 1; }
    96% { transform: skewX(2deg); }
    97% { transform: none; }
  }
  .status {
    display: none;
    font-size: 0.78rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #4f7a5c;
    margin-top: -0.8rem;
    text-shadow: 0 0 8px rgba(77,255,122,0.4);
  }
  .status.show { display: block; }

  /* ---- hidden hotspot (top-right corner) ---- */
  .hotspot {
    position: fixed;
    top: 0; right: 0;
    width: 56px; height: 56px;
    z-index: 100;
    cursor: default;
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="scan"></div>
  <div class="hud tl">BYD//LABS <span class="blink">&#9608;</span></div>
  <div class="hud br">NODE&middot;01 &middot; SECURE</div>

  <div class="lockup">
    <div class="mark-wrap" id="markWrap">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="2.4" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>
        <!-- rotating dashed hex ring -->
        <g class="ring" fill="none" stroke="#4dff7a" stroke-width="0.8" stroke-dasharray="3 5" opacity="0.45">
          <path d="M32 4 58 18.5 58 45.5 32 60 6 45.5 6 18.5 Z"/>
        </g>
        <!-- hex frame -->
        <path d="M32 2 58 17 58 47 32 62 6 47 6 17 Z" fill="#0c1a10" stroke="#2ee66b" stroke-width="1.5"/>
        <!-- database / data symbol -->
        <g fill="none" stroke="#4dff7a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
          <ellipse cx="32" cy="20" rx="14" ry="5"/>
          <path d="M18 20 v24"/>
          <path d="M46 20 v24"/>
          <path d="M18 44 a14 5 0 0 0 28 0"/>
          <path d="M18 32 a14 5 0 0 0 28 0"/>
        </g>
      </svg>
    </div>
    <div class="wordmark">BYD<span class="slash">/</span>LABS</div>
    <div class="status" id="status">no service found</div>
  </div>

  <div class="hotspot" id="hotspot" aria-hidden="true"></div>

  <script>
    // fallback error line — only shown when a dead subdomain hits the catch-all (?err) redirect.
    // The dead host is passed reliably via the ?host= query param (captured in Traefik).
    (function () {
      var el = document.getElementById("status");
      var params = new URLSearchParams(location.search);
      if (!params.has("err")) return;
      var host = params.get("host");
      if (host) host = host.replace(/\/+$/, "");
      el.textContent = host ? "no service found for " + host : "no service found";
      el.className = "status show";
    })();

    // ?exit=1 — clears the dashboard cookie and returns to the logo
    // (reaches this page even when the cookie is set, via Traefik's !Query(exit,1))
    if (new URLSearchParams(location.search).get("exit") === "1") {
      document.cookie = "byd_dash=1; path=/; max-age=0; SameSite=Lax;";
      location.replace("/");
    }

    // mouse parallax on the mark
    (function () {
      var wrap = document.getElementById("markWrap");
      var tx = 0, ty = 0, cx = 0, cy = 0;
      document.addEventListener("mousemove", function (e) {
        tx = (e.clientX / window.innerWidth - 0.5) * 20;
        ty = (e.clientY / window.innerHeight - 0.5) * 20;
      });
      (function loop() {
        cx += (tx - cx) * 0.07;
        cy += (ty - cy) * 0.07;
        wrap.style.transform = "translate(" + cx.toFixed(2) + "px," + cy.toFixed(2) + "px)";
        requestAnimationFrame(loop);
      })();
    })();

    // hidden 3-click login: set the cookie, reload into the dashboard
    (function () {
      var hotspot = document.getElementById("hotspot");
      var clicks = [];
      hotspot.addEventListener("click", function () {
        var now = Date.now();
        clicks = clicks.filter(function (t) { return now - t < 2500; });
        clicks.push(now);
        if (clicks.length >= 3) {
          clicks = [];
          document.cookie = "byd_dash=1; path=/; SameSite=Lax;";
          location.reload();
        }
      });
    })();
  </script>
</body>
</html>
