<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BYD Labs</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #070907;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(30rem 30rem at 50% 40%, rgba(77, 255, 122, 0.14), transparent 62%),
      radial-gradient(46rem 46rem at 50% 110%, rgba(46, 230, 107, 0.07), transparent 60%);
    pointer-events: none;
  }
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.16) 0 1px, transparent 1px 3px);
    pointer-events: none;
    z-index: 1;
  }
  .lockup {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2rem;
  }
  .mark {
    width: clamp(9rem, 30vw, 17rem);
    height: clamp(9rem, 30vw, 17rem);
    filter: drop-shadow(0 0 14px rgba(77, 255, 122, 0.38));
    animation: throb 3.4s ease-in-out infinite;
  }
  @keyframes throb {
    0%, 100% { filter: drop-shadow(0 0 10px rgba(77,255,122,0.28)); }
    50%      { filter: drop-shadow(0 0 22px rgba(77,255,122,0.55)); }
  }
  .wordmark {
    font-weight: 700;
    font-size: clamp(1.5rem, 5.4vw, 2.6rem);
    letter-spacing: 0.34em;
    color: #d6ffe2;
    text-indent: 0.34em;
    text-shadow:
      0 0 6px rgba(77, 255, 122, 0.7),
      0 0 18px rgba(77, 255, 122, 0.45),
      0 0 42px rgba(77, 255, 122, 0.25);
  }
  .wordmark .slash { color: #4dff7a; }
  .status {
    display: none;
    font-size: 0.78rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #4f7a5c;
    margin-top: -0.7rem;
    text-shadow: 0 0 8px rgba(77,255,122,0.4);
  }
  .status.show { display: block; }

  /* ---- hidden hotspot (top-right corner) ---- */
  .hotspot {
    position: fixed;
    top: 0; right: 0;
    width: 56px; height: 56px;
    z-index: 50;
    cursor: default;
  }
</style>
</head>
<body>
  <div class="lockup">
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
      <defs>
        <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="2.4" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
      <!-- hex frame -->
      <path d="M32 2 58 17 58 47 32 62 6 47 6 17 Z" fill="#0c1a10" stroke="#2ee66b" stroke-width="1.5"/>
      <!-- database / data symbol -->
      <g fill="none" stroke="#4dff7a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
        <ellipse cx="32" cy="20" rx="14" ry="5"/>
        <path d="M18 20 v24"/>
        <path d="M46 20 v24"/>
        <path d="M18 44 a14 5 0 0 0 28 0"/>
        <path d="M18 32 a14 5 0 0 0 28 0"/>
      </g>
    </svg>
    <div class="wordmark">BYD<span class="slash">/</span>LABS</div>
    <div class="status" id="status">no service found</div>
  </div>

  <div class="hotspot" id="hotspot" aria-hidden="true"></div>

  <script>
    // fallback error line (referrer carries the dead host through the 302)
    (function () {
      var el = document.getElementById("status");
      var refHost = "";
      try { refHost = new URL(document.referrer).hostname; } catch (e) {}
      var isFallback = new URLSearchParams(location.search).has("err");
      var isRef = refHost && refHost !== location.hostname;
      if (!isFallback && !isRef) return;
      el.textContent = isRef ? "no service found for " + refHost : "no service found";
      el.className = "status show";
    })();

    // ?exit=1 — clears the dashboard cookie and returns to the logo
    // (reaches this page even when the cookie is set, via Traefik's !Query(exit,1))
    if (new URLSearchParams(location.search).get("exit") === "1") {
      document.cookie = "byd_dash=1; path=/; max-age=0; SameSite=Lax;";
      location.replace("/");
    }

    // hidden 3-click login: set the cookie, reload into the dashboard
    (function () {
      var hotspot = document.getElementById("hotspot");
      var clicks = [];
      hotspot.addEventListener("click", function () {
        var now = Date.now();
        clicks = clicks.filter(function (t) { return now - t < 2500; });
        clicks.push(now);
        if (clicks.length >= 3) {
          clicks = [];
          document.cookie = "byd_dash=1; path=/; SameSite=Lax;";
          location.reload();
        }
      });
    })();
  </script>
</body>
</html>
