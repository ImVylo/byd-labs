<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BYD Labs</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #0b0b0d;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(32rem 32rem at 50% 42%, rgba(255, 122, 26, 0.12), transparent 62%);
    pointer-events: none;
  }
  .lockup {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.9rem;
  }
  .mark {
    width: clamp(9rem, 30vw, 17rem);
    height: clamp(9rem, 30vw, 17rem);
  }
  .wordmark {
    font-weight: 700;
    font-size: clamp(1.5rem, 5.4vw, 2.6rem);
    letter-spacing: 0.34em;
    color: #ece9e1;
    text-indent: 0.34em;
  }
  .wordmark .slash { color: #ff7a1a; }
  .status {
    display: none;
    font-size: 0.78rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #6b675e;
    margin-top: -0.6rem;
  }
  .status.show { display: block; }

  /* ---- hidden hotspot (top-right corner) ---- */
  .hotspot {
    position: fixed;
    top: 0; right: 0;
    width: 56px; height: 56px;
    z-index: 50;
    cursor: default;
  }
</style>
</head>
<body>
  <div class="lockup">
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
      <path d="M32 2 58 17 58 47 32 62 6 47 6 17 Z" fill="#ff7a1a"/>
      <path d="M36 8 18 38 29 38 25 56 47 24 35 24 Z" fill="#0b0b0d"/>
    </svg>
    <div class="wordmark">BYD<span class="slash">/</span>LABS</div>
    <div class="status" id="status">no service found</div>
  </div>

  <div class="hotspot" id="hotspot" aria-hidden="true"></div>

  <script>
    // fallback error line (referrer carries the dead host through the 302)
    (function () {
      var el = document.getElementById("status");
      var refHost = "";
      try { refHost = new URL(document.referrer).hostname; } catch (e) {}
      var isFallback = new URLSearchParams(location.search).has("err");
      var isRef = refHost && refHost !== location.hostname;
      if (!isFallback && !isRef) return;
      el.textContent = isRef ? "no service found for " + refHost : "no service found";
      el.className = "status show";
    })();

    // ?exit=1 clears the dashboard cookie and returns to the logo
    if (new URLSearchParams(location.search).get("exit") === "1") {
      document.cookie = "byd_dash=1; path=/; max-age=0; SameSite=Lax;";
      location.replace("/");
    }

    // hidden 3-click login: set the cookie, reload into the dashboard
    (function () {
      var hotspot = document.getElementById("hotspot");
      var clicks = [];
      hotspot.addEventListener("click", function () {
        var now = Date.now();
        clicks = clicks.filter(function (t) { return now - t < 2500; });
        clicks.push(now);
        if (clicks.length >= 3) {
          clicks = [];
          document.cookie = "byd_dash=1; path=/; SameSite=Lax;";
          location.reload();
        }
      });
    })();
  </script>
</body>
</html>
